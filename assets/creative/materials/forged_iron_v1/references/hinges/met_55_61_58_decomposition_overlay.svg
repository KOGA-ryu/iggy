    <line x1="48" y1="115" x2="75" y2="72" class="amber line"/>
    <line x1="75" y1="72" x2="184" y2="72" class="green line"/>
    <line x1="184" y1="72" x2="211" y2="115" class="amber line"/>
    <line x1="48" y1="115" x2="211" y2="115" class="cyan thin dash"/>
    <text x="88" y="61" class="small">flat face / crown</text>
    <text x="12" y="106" class="small">aperture wall</text>
    <text x="82" y="106" class="small">bevel shoulder → aperture lip</text>
    <path d="M 48 58 L 75 58" class="amber thin"
          marker-start="url(#arrowAmber)" marker-end="url(#arrowAmber)"/>
    <text x="51" y="49" class="small">bevel width</text>
    <path d="M 224 115 L 224 72" class="amber thin"
          marker-start="url(#arrowAmber)" marker-end="url(#arrowAmber)"/>
    <text x="233" y="96" class="small">rise</text>
  </g>
  <g transform="translate(780 781)">
    <text x="0" y="0" class="small">station</text>
    <text x="103" y="0" class="small">width</text>
    <text x="158" y="0" class="small">bevel</text>
    <text x="215" y="0" class="small">rise</text>
    <text x="267" y="0" class="small">flat</text>
    <g class="body">
      <text x="0" y="25">root</text><text x="103" y="25">1.30</text><text x="158" y="25">.16</text><text x="215" y="25">.08</text><text x="267" y="25">.68</text>
      <text x="0" y="48">throat</text><text x="103" y="48">.88</text><text x="158" y="48">.22</text><text x="215" y="48">.10</text><text x="267" y="48">.56</text>
      <text x="0" y="71">shoulder</text><text x="103" y="71">1.02</text><text x="158" y="71">.26</text><text x="215" y="71">.13</text><text x="267" y="71">.48</text>
      <text x="0" y="94">belly</text><text x="103" y="94">.84</text><text x="158" y="94">.30</text><text x="215" y="94">.17</text><text x="267" y="94">.40</text>
      <text x="0" y="117">return</text><text x="103" y="117">.94</text><text x="158" y="117">.25</text><text x="215" y="117">.13</text><text x="267" y="117">.50</text>
      <text x="0" y="140">tip</text><text x="103" y="140">1.24</text><text x="158" y="140">.18</text><text x="215" y="140">.08</text><text x="267" y="140">.64</text>
    </g>
  </g>

  <!-- Hard invalidations. -->
  <text x="446" y="979" class="heading">Hard invalidations from the existing GH-018 baseline</text>
  <g class="body">
    <text x="446" y="1003" fill="#ef6f6c">× full catalogue length assigned to moving leaf</text>
    <text x="446" y="1025" fill="#ef6f6c">× two constant-width sine ribbons and false woven depth</text>
    <text x="446" y="1047" fill="#ef6f6c">× one rolled eye, generic end pads, reversed tail/pivot reading</text>
    <text x="817" y="1003" fill="#8bd878">✓ true holes and separate fasteners</text>
    <text x="817" y="1025" fill="#8bd878">✓ named datums and applied runtime meshes</text>
    <text x="817" y="1047" fill="#8bd878">✓ multi-view clay proof discipline</text>
  </g>
  </g>
</svg>
