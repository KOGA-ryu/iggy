    <circle cx="344" cy="803" r="10" fill="#8bd878"/><text x="341" y="807">5</text>
  </g>

  <!-- Dossier title and decisive reading. -->
  <g transform="translate(412 0) scale(0.847715736 1) translate(-412 0)">
  <text x="446" y="42" class="title">55.61.58 — construction before polygons</text>
  <text x="446" y="68" class="body">The 40.6 cm catalogue length belongs to this complete two-leaf object.</text>
  <text x="446" y="89" class="body">The long leaf is a connected five-cell openwork plate, not two sine ribbons.</text>
  <line x1="446" y1="109" x2="1165" y2="109" stroke="#3a414a"/>

  <!-- Q0 authored quarter. -->
  <text x="446" y="143" class="heading">A. Author one quarter curve</text>
  <text x="446" y="164" class="small">Q0 controls the tip departure, shoulder acceleration, belly, and tangent.</text>
  <rect x="446" y="180" width="330" height="236" rx="8"
        fill="#11161b" stroke="#343c45"/>
  <line x1="480" y1="371" x2="742" y2="371" class="cyan thin dash"/>
  <line x1="480" y1="371" x2="480" y2="205" class="cyan thin dash"/>
  <path d="M 480 371
           C 517 371, 570 245, 611 205"
        class="green line"/>
  <polyline points="480,371 517,371 570,245 611,205"
            class="amber thin dash"/>
  <g fill="#f6bd60">
    <circle cx="480" cy="371" r="5"/>
    <circle cx="517" cy="371" r="4"/>
    <circle cx="570" cy="245" r="4"/>
    <circle cx="611" cy="205" r="5"/>
  </g>
  <text x="489" y="390" class="small">tip P0</text>
  <text x="619" y="210" class="small">belly P3</text>
  <text x="631" y="403" class="small">mirror U</text>
  <text x="487" y="218" class="small">mirror V</text>
  <path d="M 504 225 L 504 344" class="cyan thin"
        marker-start="url(#arrowCyan)" marker-end="url(#arrowCyan)"/>
  <path d="M 520 392 L 703 392" class="cyan thin"
        marker-start="url(#arrowCyan)" marker-end="url(#arrowCyan)"/>

  <!-- Derived family icons. -->
  <text x="808" y="143" class="heading">B. Derive five role-specific shapes</text>
  <text x="808" y="164" class="small">Mirror, scale, shear, rotate, clip. No new random curve.</text>
  <rect x="808" y="180" width="357" height="236" rx="8"
        fill="#11161b" stroke="#343c45"/>

  <g transform="translate(850 206)">
    <path d="M 0 55 C 0 24, 28 8, 49 0 C 70 8, 98 24, 98 55
             C 98 86, 70 102, 49 110 C 28 102, 0 86, 0 55 Z"
          class="green line"/>
    <text x="5" y="132" class="small">S1 lancet</text>
  </g>
  <g transform="translate(1000 203) rotate(18 49 55)">
    <path d="M 0 55 C 3 20, 32 4, 49 0 C 68 13, 94 30, 98 55
             C 91 87, 69 102, 49 110 C 29 98, 7 80, 0 55 Z"
          class="violet line"/>
  </g>
  <text x="1008" y="338" class="small">S2 flank leaf</text>

  <g transform="translate(850 346) scale(.72)">
    <path d="M 0 34 C 8 7, 31 1, 49 0 C 72 7, 91 19, 98 34
             C 88 56, 69 66, 49 69 C 28 63, 8 50, 0 34 Z"
          class="amber line"/>
  </g>
  <text x="850" y="409" class="small">S3 petal</text>

  <path d="M 988 370 C 1006 343, 1042 343, 1060 370
           C 1044 390, 1004 390, 988 370 Z"
        class="cyan line"/>
  <text x="987" y="409" class="small">S4 rail lune</text>

  <path d="M 1102 341 L 1134 370 L 1102 399 L 1070 370 Z"
        class="red line"/>
  <circle cx="1102" cy="370" r="7" class="red thin"/>
  <text x="1073" y="409" class="small">S5 terminal</text>

  <!-- Cell negative-space grammar. -->
  <text x="446" y="457" class="heading">C. Validate the empty spaces, not only the iron</text>
  <rect x="446" y="475" width="719" height="217" rx="8"
        fill="#11161b" stroke="#343c45"/>
  <g transform="translate(475 492)">
    <rect x="0" y="0" width="286" height="180" rx="4"
          fill="#242a31" stroke="#6f7781" stroke-width="4"/>
    <!-- Approximate one-cell apertures. -->
    <path d="M 126 18 C 111 48, 112 68, 143 90
             C 174 68, 175 48, 160 18
             C 151 6, 135 6, 126 18 Z"
          fill="#f3efe3" stroke="#8bd878" stroke-width="2"/>
    <path d="M 43 40 C 66 18, 96 18, 116 38
             C 92 60, 77 83, 60 112
             C 41 94, 33 63, 43 40 Z"
          fill="#f3efe3" stroke="#b59cff" stroke-width="2"/>
    <path d="M 243 40 C 220 18, 190 18, 170 38
             C 194 60, 209 83, 226 112
             C 245 94, 253 63, 243 40 Z"
          fill="#f3efe3" stroke="#b59cff" stroke-width="2"/>
    <path d="M 77 125 C 94 108, 112 109, 126 133
             C 110 150, 91 163, 72 170 C 58 154, 61 137, 77 125 Z"
          fill="#f3efe3" stroke="#f6bd60" stroke-width="2"/>
    <path d="M 209 125 C 192 108, 174 109, 160 133
             C 176 150, 195 163, 214 170 C 228 154, 225 137, 209 125 Z"
          fill="#f3efe3" stroke="#f6bd60" stroke-width="2"/>
    <path d="M 7 121 C 28 105, 42 109, 52 131
             C 38 153, 22 161, 7 156 Z"
          fill="#f3efe3" stroke="#57d3dd" stroke-width="2"/>
    <path d="M 279 121 C 258 105, 244 109, 234 131
             C 248 153, 264 161, 279 156 Z"
          fill="#f3efe3" stroke="#57d3dd" stroke-width="2"/>
  </g>
  <g transform="translate(795 500)">
    <circle cx="6" cy="12" r="5" fill="#8bd878"/><text x="19" y="16" class="body">1 central lancet per cell</text>
    <circle cx="6" cy="42" r="5" fill="#b59cff"/><text x="19" y="46" class="body">2 flank leaves per cell</text>
    <circle cx="6" cy="72" r="5" fill="#f6bd60"/><text x="19" y="76" class="body">4 diagonal petals per junction</text>
    <circle cx="6" cy="102" r="5" fill="#57d3dd"/><text x="19" y="106" class="body">2 rail lunes per junction</text>
    <text x="0" y="145" class="small">The black web must remain connected.</text>
    <text x="0" y="165" class="small">No aperture may close after beveling.</text>
  </g>

  <!-- Section drawing. -->
  <text x="446" y="735" class="heading">D. Draw the leaf with section changes under plain light</text>
  <rect x="446" y="753" width="719" height="184" rx="8"
        fill="#11161b" stroke="#343c45"/>
  <g transform="translate(474 778)">
    <path d="M 0 115 L 48 115 L 75 72 L 184 72 L 211 115 L 260 115
