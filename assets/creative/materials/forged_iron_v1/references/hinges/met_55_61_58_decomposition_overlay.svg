         preserveAspectRatio="xMidYMid meet"/>
  <g transform="translate(412 0) scale(0.847715736 1) translate(-412 0)">
    <rect x="412" y="0" width="788" height="1080" fill="url(#panel)"/>
    <line x1="412" y1="0" x2="412" y2="1080" stroke="#4c535c" stroke-width="2"/>
  </g>

  <!-- Complete-object anatomy on the right-hand museum hinge. -->
  <rect x="244" y="45" width="111" height="195" rx="5"
        fill="#57d3dd" fill-opacity="0.13" class="cyan line"/>
  <rect x="241" y="235" width="119" height="68" rx="5"
        fill="#f6bd60" fill-opacity="0.18" class="amber line"/>
  <rect x="240" y="300" width="121" height="126" rx="5"
        fill="#b59cff" fill-opacity="0.15" class="violet line"/>
  <rect x="244" y="420" width="113" height="466" rx="5"
        fill="#8bd878" fill-opacity="0.10" class="green line"/>
  <rect x="241" y="880" width="120" height="122" rx="5"
        fill="#ef6f6c" fill-opacity="0.13" class="red line"/>
  <path d="M 246 997 L 357 997 L 348 1050 L 255 1050 Z"
        fill="#f6bd60" fill-opacity="0.14" class="amber line"/>

  <g>
    <rect x="250" y="53" width="85" height="20" rx="4" fill="#57d3dd"/>
    <text x="258" y="67" class="imageLabel">FIXED LEAF</text>
    <rect x="248" y="246" width="101" height="20" rx="4" fill="#f6bd60"/>
    <text x="256" y="260" class="imageLabel">5+ KNUCKLES</text>
    <rect x="249" y="309" width="96" height="20" rx="4" fill="#b59cff"/>
    <text x="257" y="323" class="imageLabel">PIVOT PAD</text>
    <rect x="249" y="888" width="88" height="20" rx="4" fill="#ef6f6c"/>
    <text x="257" y="902" class="imageLabel">TAIL PAD</text>
    <rect x="250" y="1015" width="99" height="20" rx="4" fill="#f6bd60"/>
    <text x="258" y="1029" class="imageLabel">PIERCED TAIL</text>
  </g>

  <!-- Five measured pattern bays. -->
  <g class="green thin">
    <rect x="248" y="424" width="105" height="92"/>
    <rect x="248" y="516" width="105" height="92"/>
    <rect x="248" y="608" width="105" height="92"/>
    <rect x="248" y="700" width="105" height="92"/>
    <rect x="248" y="792" width="105" height="92"/>
