<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1080"
     height="1080"
     viewBox="0 0 1080 1080">
  <defs>
    <style>
      .title { font: 700 24px -apple-system, BlinkMacSystemFont, sans-serif; fill: #f7f3e8; }
      .heading { font: 700 16px -apple-system, BlinkMacSystemFont, sans-serif; fill: #f7f3e8; }
      .body { font: 13px -apple-system, BlinkMacSystemFont, sans-serif; fill: #d8d4c8; }
      .small { font: 11px -apple-system, BlinkMacSystemFont, sans-serif; fill: #bcb7aa; }
      .imageLabel { font: 700 11px -apple-system, BlinkMacSystemFont, sans-serif; fill: #101419; }
      .cyan { stroke: #57d3dd; fill: none; }
      .green { stroke: #8bd878; fill: none; }
      .amber { stroke: #f6bd60; fill: none; }
      .red { stroke: #ef6f6c; fill: none; }
      .violet { stroke: #b59cff; fill: none; }
      .line { stroke-width: 2; vector-effect: non-scaling-stroke; }
      .thin { stroke-width: 1.25; vector-effect: non-scaling-stroke; }
      .dash { stroke-dasharray: 6 5; }
    </style>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57d3dd"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f6bd60"/>
    </marker>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171c22"/>
      <stop offset="1" stop-color="#0e1115"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1080" height="1080" fill="#0b0d10"/>
  <image x="0" y="0" width="412" height="1080"
