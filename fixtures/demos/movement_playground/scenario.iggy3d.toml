[[entities]]
stable_name = "training_dummy"
kind = "Npc"
active = true
persistent = true
position = [3.000, 0.000, -8.000]
bounds_min = [-0.250, 0.000, -0.250]
bounds_max = [0.250, 1.200, 0.250]
targetable = true
target_actions = ["Attack", "Inspect"]
combatant = true
faction_id = 2
hit_points = 6
max_hit_points = 6

[[entities]]
stable_name = "spell_target_beta"
kind = "Npc"
active = true
persistent = true
position = [-3.500, 0.000, -10.500]
bounds_min = [-0.300, 0.000, -0.300]
bounds_max = [0.300, 1.500, 0.300]
targetable = true
target_actions = ["Attack", "Inspect"]
combatant = true
