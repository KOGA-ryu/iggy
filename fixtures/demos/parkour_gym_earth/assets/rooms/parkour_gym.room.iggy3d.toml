[room]
id = "parkour_gym"
version = 1
units = "ft"
source = "iggy3d.hand_authored"
source_file = "fixtures/demos/parkour_gym_earth/assets/rooms/parkour_gym.room.iggy3d.toml"
source_subset = "parkour_gym_v1"

[conversion]
feet_to_meters = 0.3048
world_axis_x = "east"
world_axis_y = "up"
world_axis_z = "south"

# ---------------------------------------------------------------------------
# Parkour gym: graded feel-test stations. Authored in FEET (kFeetToMeters 0.3048).
# Boundary-critical grades are OFF the strict boundary so feet->meter conversion
# cannot flip a `>` comparison (clamber max is 1.80 m; the top PASSING rung is
# authored at 5.75 ft = 1.753 m, and the over-max wall at 7.5 ft = 2.286 m).
# The room asset file is BYTE-IDENTICAL between parkour_gym_earth and _giant --
# only the scenario's movement_profile differs.
# ---------------------------------------------------------------------------

