[scenario]
id = "npc_vision_lab.runtime_loop"

[defaults]
fixed_tick_rate_hz = 20
interaction_range_meters = 1.500
movement_distance_meters = 3.000
slow_time_scale = 0.250
initial_clock = "Normal"
default_realtime_camera = "ThirdPerson"
default_tactical_camera = "TacticalOverhead"

[[players]]
slot = 0
kind = "Local"
actor = "player"

# The player spawns ~3 m west of the hostile watcher, directly behind it: the
# watcher faces east (+X, facing_degrees = 90), so the player starts inside its
# 6 m radius but OUTSIDE its vision cone -> unaware (cyan gaze blade). Circle
# around to the watcher's front (east side) to step into the cone and get
# spotted (blade turns alert-red and it chases).
[[entities]]
stable_name = "player"
kind = "Player"
active = true
persistent = true
position = [-1.500, 0.000, 0.000]
bounds_min = [-0.250, 0.000, -0.250]
bounds_max = [0.250, 1.800, 0.250]
targetable = false
target_actions = []
combatant = true
faction_id = 1
hit_points = 10
max_hit_points = 10

[[entities]]
stable_name = "watcher"
kind = "Npc"
active = true
persistent = true
position = [1.500, 0.000, 0.000]
bounds_min = [-0.250, 0.000, -0.250]
bounds_max = [0.250, 1.200, 0.250]
targetable = true
target_actions = ["Attack", "Inspect"]
combatant = true
faction_id = 2
hit_points = 3
max_hit_points = 3

[[entities]]
stable_name = "gold_key"
kind = "Pickup"
active = true
persistent = true
position = [0.000, 0.000, 1.000]
bounds_min = [-0.100, 0.000, -0.100]
bounds_max = [0.100, 0.100, 0.100]
targetable = true
target_actions = ["Interact", "Inspect"]
item_id = "gold_key"
item_count = 1
interaction = "Pickup"
deactivate_on_success = true
objective_ref = "collect_gold_key"

[[ai_actors]]
actor = "watcher"
behavior_profile_id = "melee_training"
facing_degrees = 90.000

[[objectives]]
id = "collect_gold_key"
initial_status = "Active"
condition = "InventoryContains"
player_slot = 0
item_id = "gold_key"
item_count = 1
complete_status = "Complete"
